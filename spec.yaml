# ModelArena — DigitalOcean App Platform spec
# Deploy:  doctl apps create --spec spec.yaml   (or paste into the dashboard)
#
# The secret DO_API_TOKEN is declared here but its VALUE is intentionally left
# blank so no secret lands in the repo. Fill it in the App dashboard
# (Component -> Environment Variables -> "Secret") after the app is created,
# or create the app from a locally-generated spec that injects the value
# (see README "Deploy").
name: modelarena
region: blr
services:
  - name: modelarena
    github:
      repo: mayankasthana/modelarena
      branch: main
      deploy_on_push: true
    build_command: npm ci
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /healthz
    envs:
      - key: DO_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: DO_INFERENCE_BASE_URL
        scope: RUN_TIME
        value: "https://inference.do-ai.run/v1"
